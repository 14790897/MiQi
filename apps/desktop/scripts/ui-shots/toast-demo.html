<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><style>
:root { --surface:#fff; --success:#36c860; --success-bg:#d4f5e0; --success-text:#1d7e3a; --text:#121212; --text-muted:#555; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui; background: #f5f6e5; min-height: 100vh; position: relative; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.toast {
  position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--success); border-radius: 12px;
  padding: 12px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.12); animation: msgIn .3s cubic-bezier(.22,.8,.32,1);
  max-width: 380px;
}
.badge { width: 24px; height: 24px; border-radius: 50%; background: var(--success-bg); color: var(--success-text);
  display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.title { font-size: 13px; font-weight: 600; color: var(--text); }
.fname { font-size: 11.5px; color: var(--text-muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 8px; background: var(--success-bg);
  color: var(--success-text); border: none; cursor: pointer; flex-shrink: 0; }
</style></head><body>
<div class="toast">
  <span class="badge">✓</span>
  <div>
    <div class="title">下载成功</div>
    <div class="fname">MOF-5_synthesis_review_2024.pdf</div>
  </div>
  <button class="btn">打开文件夹</button>
</div>
</body></html>
